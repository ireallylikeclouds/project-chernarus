name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: check (${{ matrix.os }})
    # Linux is a first-class platform (development, Proton/Wine reference setups);
    # Windows is where the reference game runs natively.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # Only GitHub-owned actions: works under "allow GitHub actions only"
    # repository policies and avoids unpinned third-party code in CI.
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain (keep in sync with rust-toolchain.toml)
        run: rustup toolchain install 1.94.1 --profile minimal -c rustfmt -c clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests (includes repository guard and provenance manifest)
        run: cargo test --workspace
      - name: Provenance check (CLI)
        run: cargo run -q -p chernarus-refscan -- provenance
      - name: Parity scenarios run
        run: cargo run -q -p chernarus-parity-cli -- run --strict
