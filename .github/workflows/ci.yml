name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Keep in sync with rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.1"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests (includes repository guard and provenance manifest)
        run: cargo test --workspace
      - name: Provenance check (CLI)
        run: cargo run -q -p chernarus-refscan -- provenance
      - name: Parity scenarios run
        run: cargo run -q -p chernarus-parity-cli -- run --strict
