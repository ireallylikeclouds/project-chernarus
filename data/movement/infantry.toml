# Infantry movement parameters (data-driven; read by crates/sim/src/movement.rs).
#
# EVERY VALUE BELOW IS AN UNKNOWN PLACEHOLDER. None has been measured in or
# extracted from the reference game. They exist so the simulation can run and
# the measure -> compare chain can be exercised end to end.
#
# Updating a value:
#   1. capture it in the reference game (tools/capture/README.md) or extract it
#      from reference data (docs/reference/systems/movement.md);
#   2. set `value`, raise `status` (ESTIMATED / PARTIALLY_VERIFIED / VERIFIED);
#   3. set `source` to the capture id or reference file + field it came from;
#   4. update docs/parity/parity-matrix.md.
#
# Units: metres, seconds. Directions are relative to the body; left and right
# are assumed symmetric (UNKNOWN).

