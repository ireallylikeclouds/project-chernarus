[package]
name = "chernarus-parity-cli"
description = "Runs parity scenarios and imports reference captures."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "parity"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chernarus-core.workspace = true
chernarus-parity.workspace = true
chernarus-sim.workspace = true
clap = { version = "4", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true
